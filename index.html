<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>スタディビルディング</title>
    <!-- Supabaseのシステムを読み込むライブラリ -->
    <script src="https://jsdelivr.net"></script>
    <style>
        /* --- 全体の基本スタイル --- */
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { color: #2c3e50; margin-bottom: 5px; }
        .container {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            max-width: 600px;
            width: 100%;
            box-sizing: border-box;
            text-align: center;
            margin-bottom: 20px;
        }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .card { background: #fafbfc; border: 1px solid #e1e4e8; border-radius: 8px; padding: 15px; }
        .time-display { font-size: 2rem; font-weight: bold; color: #34495e; margin: 10px 0; }
        button { padding: 10px 20px; font-size: 1rem; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin: 5px; transition: background 0.2s; }
        .btn-start { background-color: #2ecc71; color: white; }
        .btn-start:hover { background-color: #27ae60; }
        .btn-reset { background-color: #e74c3c; color: white; }
        .btn-reset:hover { background-color: #c0392b; }
        .footer { margin-top: 20px; font-size: 0.85rem; color: #7f8c8d; line-height: 1.6; }
        .footer a { color: #3498db; text-decoration: none; }

        /* --- 認証画面のスタイル --- */
        .auth-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background-color: #1a1a1a; z-index: 9999;
        }
        .auth-box {
            background: white; padding: 35px; border-radius: 12px; width: 300px; text-align: center;
            box-shadow: 0 4px 25px rgba(0,0,0,0.5);
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
        }
        .auth-box h2 { margin-top: 0; color: #2c3e50; font-size: 1.5rem; }
        .auth-box input { width: 100%; padding: 12px; margin: 8px 0; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 1rem; }
        
        .btn-auth { width: 100%; padding: 12px; background-color: #3498db; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px; font-size: 1rem; }
        .btn-auth:hover { background-color: #2980b9; }
        
        .btn-switch {
            display: block; width: 100%; padding: 12px; background-color: #f1f2f6; color: #3498db;
            border: 1px solid #3498db; border-radius: 6px; cursor: pointer; font-weight: bold;
            margin-top: 20px; font-size: 0.9rem; box-sizing: border-box;
        }
        .btn-switch:hover { background-color: #e1f5fe; }
        
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <!-- 認証画面の全体エリア -->
    <div id="authContainer" class="auth-container">
        
        <!-- 【A】ログイン画面 -->
        <div id="loginForm" class="auth-box">
            <h2>スタディビルディング</h2>
            <p style="font-size:14px; color:#666; margin-bottom: 20px;">クラウドログイン</p>
            <input type="text" id="loginUser" placeholder="ユーザー名">
            <input type="password" id="loginPass" placeholder="パスワード">
            <button class="btn-auth" onclick="handleLogin()">ログイン</button>
            <p id="loginError" style="color: #e74c3c; font-size: 14px; margin-top: 15px; font-weight: bold;"></p>
            
            <button class="btn-switch" onclick="showRegisterPage()">初めての方はこちら（アカウント作成）</button>
        </div>

        <!-- 【B】アカウント作成画面 -->
        <div id="registerForm" class="auth-box hidden">
            <h2>スタディビルディング</h2>
            <p style="font-size:14px; color:#666; margin-bottom: 20px;">新規アカウント作成</p>
            <input type="text" id="regUser" placeholder="新しいユーザー名">
            <input type="password" id="regPass" placeholder="新しいパスワード">
            <button class="btn-auth" onclick="handleRegister()">アカウントを作成</button>
            <p id="regError" style="color: #e74c3c; font-size: 14px; margin-top: 15px; font-weight: bold;"></p>
            
            <button class="btn-switch" onclick="showLoginPage()">登録済みの方はこちら（ログイン）</button>
        </div>

    </div>

    <!-- メインのアプリ画面 -->
    <div class="container">
        <!-- ログアウトボタンを右上に綺麗に配置 -->
        <div style="display: flex; justify-content: flex-end; width: 100%;">
            <button onclick="handleLogout()" style="background-color: #7f8c8d; color: white; padding: 6px 12px; font-size: 0.85rem; border-radius: 4px;">ログアウト</button>
        </div>

        <h1>スタディビルディング</h1>
        <p style="color: #7f8c8d; margin-top: 0;">集中した時間だけ、ビルが育ちます。</p>
        <p id="welcomeMessage" style="font-weight: bold; color: #2c3e50; margin-bottom: 20px;"></p>

        <div class="grid">
            <div class="card">
                <h3>育成中の町</h3>
                <div id="townDisplay" style="font-size: 1.2rem;">🏢 🏗️ 🏬</div>
            </div>
            <div class="card">
                <h3>育成中のビル</h3>
                <div id="buildingDisplay" style="font-size: 1.2rem;">🧱 1階建て</div>
            </div>
        </div>

        <div class="card" style="margin-bottom: 20px;">
            <h3>合計集中時間</h3>
            <div class="time-display" id="totalTimeDisplay">00:00:00</div>
            <p style="color: #7f8c8d; font-size: 0.9rem;" id="nextLevelDisplay">次の階まで あと 25分</p>
        </div>

        <div>
            <button class="btn-start" onclick="toggleTimer()" id="startBtn">スタート</button>
            <button class="btn-reset" onclick="resetTimer()">リセット</button>
        </div>

        <h2 style="margin-top: 40px; color: #2c3e50;">集中時間の集計</h2>
        <div class="grid">
            <div class="card"><strong>今日</strong><br><span id="statsToday">0分</span></div>
            <div class="card"><strong>今週（月〜日）</strong><br><span id="statsWeek">0分</span></div>
            <div class="card"><strong>今月</strong><br><span id="statsMonth">0分</span></div>
            <div class="card"><strong>今年</strong><br><span id="statsYear">0分</span></div>
        </div>

        <div class="footer">
            <p>日本時間で集計しています。</p>
            <p>このサイトはJavaScript・HTML・CSSの3つのプログラミング言語によって動作しています。</p>
            <p>開発者 : 厨房 (X : <a href="https://x.com" target="_blank">@Chubou_m</a>)</p>
        </div>
    </div>

    <script>
        // --- 教えていただいたSupabaseの接続鍵を完全埋め込み ---
        const SUPABASE_URL = "https://xbphswphuxbhvenlgjuw.supabase.co";
        const SUPABASE_KEY = "sb_publishable_h7QoAhBp-eZ-shCF4bgLWQ_Q_lp36_a";
        const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let currentUser = null;
        let timerInterval = null;
        let totalSeconds = 0;
        let isRunning = false;

        // --- 画面切り替え ---
        function showRegisterPage() {
            document.getElementById("loginForm").classList.add("hidden");
            document.getElementById("registerForm").classList.remove("hidden");
        }

        function showLoginPage() {
            document.getElementById("registerForm").classList.add("hidden");
            document.getElementById("loginForm").classList.remove("hidden");
        }

        // --- 【新規登録】処理 ---
        async function handleRegister() {
            const user = document.getElementById("regUser").value.trim();
            const pass = document.getElementById("regPass").value.trim();
            
            if (!user || !pass) { document.getElementById("regError").innerText = "入力してください"; return; }
            if (pass.length < 6) { document.getElementById("regError").innerText = "パスワードは6文字以上にしてください"; return; }
            
            const email = user + "@studybuilding.local";
            document.getElementById("regError").innerText = "登録中...";

            const { data, error } = await _supabase.auth.signUp({ email: email, password: pass });

            if (error) {
                document.getElementById("regError").innerText = "失敗: " + error.message;
            } else {
                alert("アカウント作成完了！ログインしてください。");
                document.getElementById("regUser").value = "";
                document.getElementById("regPass").value = "";
                showLoginPage();
            }
        }

        // --- 【ログイン】処理 ---
        async function handleLogin() {
            const user = document.getElementById("loginUser").value.trim();
            const pass = document.getElementById("loginPass").value.trim();
            
            if (!user || !pass) { document.getElementById("loginError").innerText = "入力してください"; return; }
            
            const email = user + "@studybuilding.local";
            document.getElementById("loginError").innerText = "ログイン中...";

            const { data, error } = await _supabase.auth.signInWithPassword({ email: email, password: pass });

            if (error) {
                document.getElementById("loginError").innerText = "ユーザー名かパスワードが違います";
            } else {
                currentUser = user;
                loginSuccess(user);
            }
        }

        // --- ログイン成功後の処理 ---
        function loginSuccess(username) {
            document.getElementById("authContainer").classList.add("hidden");
            document.getElementById("welcomeMessage").innerText = "ようこそ、" + username + " さん！";
            loadUserData();
        }

        // --- 【ログアウト】処理 ---
        async function handleLogout() {
            if (confirm("ログアウトしますか？")) {
                await _supabase.auth.signOut();
                location.reload();
}
}
// --- クラウドからのデータ読み込み ---
async function loadUserData() {
// ローカル保存（過去の記憶）がある場合は一旦それを読み込む
totalSeconds = parseInt(localStorage.getItem('study_total_seconds')) || 0;
updateTimerDisplay();
}
// --- タイマーコントロール ---
function toggleTimer() {
const btn = document.getElementById("startBtn");
if (!isRunning) {
isRunning = true;
btn.innerText = "ストップ";
btn.style.backgroundColor = "#e67e22";
timerInterval = setInterval(function() {
totalSeconds++;
updateTimerDisplay();
// ローカルにも保険で保存しつつ稼働
localStorage.setItem('study_total_seconds', totalSeconds);
}, 1000);
} else {
isRunning = false;
btn.innerText = "スタート";
btn.style.backgroundColor = "#2ecc71";
clearInterval(timerInterval);
}
}
function resetTimer() {
if (confirm("リセットしますか？")) {
isRunning = false;
clearInterval(timerInterval);
totalSeconds = 0;
localStorage.removeItem('study_total_seconds');
updateTimerDisplay();
document.getElementById("startBtn").innerText = "スタート";
document.getElementById("startBtn").style.backgroundColor = "#2ecc71";
}
}
function updateTimerDisplay() {
const hrs = String(Math.floor(totalSeconds / 3600)).padStart(2, '0');
const mins = String(Math.floor((totalSeconds % 3600) / 60)).padStart(2, '0');
const secs = String(totalSeconds % 60).padStart(2, '0');
document.getElementById("totalTimeDisplay").innerText = hrs + ":" + mins + ":" + secs;
document.getElementById("statsToday").innerText = Math.floor(totalSeconds / 60) + "分";
}
// --- 自動ログインチェック（ページを開いた瞬間） ---
async function checkAutoLogin() {
const { data } = await _supabase.auth.getSession();
if (data.session) {
// メールアドレスからユーザー名を逆算して復元
const email = data.session.user.email;
const user = email.split('@')[0];
currentUser = user;
loginSuccess(user);
}
}
window.addEventListener("DOMContentLoaded", checkAutoLogin);
